name: UltraWear Standings Sync

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

jobs:
  sync-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Check standings sync configuration
        id: config
        env:
          ULTRAWEAR_STANDINGS_URL: ${{ secrets.ULTRAWEAR_STANDINGS_URL }}
          ULTRAWEAR_INGEST_SECRET: ${{ secrets.ULTRAWEAR_INGEST_SECRET }}
        run: |
          if [[ -n "$ULTRAWEAR_STANDINGS_URL" && -n "$ULTRAWEAR_INGEST_SECRET" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Standings sync is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Standings sync is not configured; skipping scheduled sync."
            echo "Configure ULTRAWEAR_STANDINGS_URL and ULTRAWEAR_INGEST_SECRET to enable it."
          fi

      - name: Sync standings
        if: steps.config.outputs.configured == 'true'
        env:
          ULTRAWEAR_STANDINGS_URL: ${{ secrets.ULTRAWEAR_STANDINGS_URL }}
          ULTRAWEAR_INGEST_SECRET: ${{ secrets.ULTRAWEAR_INGEST_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "$ULTRAWEAR_STANDINGS_URL" \
            -H "x-ingest-secret: $ULTRAWEAR_INGEST_SECRET"
