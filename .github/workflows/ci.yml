name: UltraWear CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'foundation/launch-sprint-foundation']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Constitution gate
        run: npm run constitution:check
      - name: Type check
        run: npm run check
      - name: Production build
        run: npm run build
