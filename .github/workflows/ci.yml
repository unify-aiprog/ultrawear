name: UltraWear CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'foundation/launch-sprint-foundation']

concurrency:
  group: ultrawear-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install_dependencies
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Preserve npm diagnostics on install failure
        if: failure() && steps.install_dependencies.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-diagnostics
          path: ~/.npm/_logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Nx verification gate
        run: npm run verify
      - name: Browser regression gates
        run: npm run verify:e2e
